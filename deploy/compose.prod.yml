# Production stack for one small VPS (docs/hosting.md). Deploy with deploy.sh: it pulls the images CI built for
# one commit (.github/workflows/images.yml) and tags them `deployed`, which is what this file runs unless
# IMAGE_TAG says otherwise.
# The build sections are the fallback when GHCR can't be used: `deploy.sh --build` builds on the server.
# Every secret comes from .env (copy .env.example; never commit it). Only Caddy publishes ports.

x-logging: &logging
  driver: json-file
  options:
    max-size: 20m
    max-file: "5"

services:
  postgres:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_DB: lookmate
      POSTGRES_USER: lookmate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lookmate -d lookmate"]
      interval: 10s
      timeout: 3s
      retries: 10
    logging: *logging

  backend:
    build: ../backend
    image: ghcr.io/gebs2180/lookmate-backend:${IMAGE_TAG:-deployed}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/lookmate
      DB_USERNAME: lookmate
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ${AUTH0_ISSUER_URI:?set AUTH0_ISSUER_URI in .env}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_AUDIENCES: ${AUTH0_AUDIENCE:?set AUTH0_AUDIENCE in .env}
      STORAGE_ENDPOINT: ${R2_ENDPOINT:?set R2_ENDPOINT in .env}
      STORAGE_ACCESS_KEY: ${R2_APP_ACCESS_KEY_ID:?set R2_APP_ACCESS_KEY_ID in .env}
      STORAGE_SECRET_KEY: ${R2_APP_SECRET_ACCESS_KEY:?set R2_APP_SECRET_ACCESS_KEY in .env}
      STORAGE_PHOTO_BUCKET: ${R2_PHOTO_BUCKET:-combpatible-photos}
      # ADMIN needs an MFA login unless .env sets this to false (temporarily off on the pilot server, 2026-11-20).
      LOOKMATE_SECURITY_REQUIRE_ADMIN_MFA: ${LOOKMATE_SECURITY_REQUIRE_ADMIN_MFA:-true}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-beta}
      # Optional features, off unless set in .env.
      NOTIFY_EMAIL_ENABLED: ${NOTIFY_EMAIL_ENABLED:-false}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      NOTIFY_EMAIL_FROM: ${NOTIFY_EMAIL_FROM:-Combpatible <notify@combpatible.app>}
      NOTIFY_APP_URL: ${NOTIFY_APP_URL:-}
      # Matching, retention and tracking (application.yml). Each default is the app's own, so leaving a key out of
      # .env changes nothing; never "${X:-}", which would replace the app's default with an empty value.
      # The embedding provider's AWS settings join these when Bedrock lands (docs/embedding-providers.md).
      MATCHING_PROVIDER: ${MATCHING_PROVIDER:-fake}
      MATCHING_REVIEW_BEFORE_PUBLISH: ${MATCHING_REVIEW_BEFORE_PUBLISH:-false}
      MATCHING_WORKER_ENABLED: ${MATCHING_WORKER_ENABLED:-true}
      RETENTION_ENABLED: ${RETENTION_ENABLED:-true}
      RETENTION_CRON: ${RETENTION_CRON:-0 15 4 * * *}
      TRACKING_TIME_ZONE: ${TRACKING_TIME_ZONE:-America/New_York}
      STORAGE_REGION: ${STORAGE_REGION:-auto}
    # No OpenCV or PDF rendering here, so far less than pokemans needs. The JVM takes 60% of this as heap.
    mem_limit: 768m
    # Runs as the image's app user with no capabilities and a read-only filesystem; the JVM and Tomcat write
    # only to /tmp (uploads go straight to storage, presigned).
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:size=64m
    logging: *logging

  caddy:
    build:
      context: ../web
      args:
        VITE_AUTH0_DOMAIN: ${AUTH0_DOMAIN:?set AUTH0_DOMAIN in .env}
        VITE_AUTH0_CLIENT_ID: ${AUTH0_SPA_CLIENT_ID:?set AUTH0_SPA_CLIENT_ID in .env}
        VITE_AUTH0_AUDIENCE: ${AUTH0_AUDIENCE}
    # CI bakes the Auth0 settings in from repository variables; the build args above apply only to --build.
    image: ghcr.io/gebs2180/lookmate-web:${IMAGE_TAG:-deployed}
    restart: unless-stopped
    depends_on:
      - backend
    # The image runs as the caddy user (uid 10001); binding 80 and 443 is the only privilege it keeps.
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
      # Named in the Content-Security-Policy (Caddyfile): where photos load from and upload to, and the login.
      PHOTO_ORIGIN: ${R2_ENDPOINT:?set R2_ENDPOINT in .env}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:?set AUTH0_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging: *logging

  # Nightly encrypted Postgres dump and photo copy to the backup bucket, and optionally off-site (backup/backup.sh).
  backup:
    build: ./backup
    image: ghcr.io/gebs2180/lookmate-backup:${IMAGE_TAG:-deployed}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGDATABASE: lookmate
      PGUSER: lookmate
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_AT: ${BACKUP_AT:-03:30}
      PHOTO_BUCKET: ${R2_PHOTO_BUCKET:-combpatible-photos}
      BACKUP_BUCKET: ${R2_BACKUP_BUCKET:-combpatible-backup}
      HEALTHCHECK_URL: ${BACKUP_HEALTHCHECK_URL:-}
      # The age public key(s) every backup is encrypted to (docs/hosting.md#backup-encryption-key). Not ":?":
      # a missing key mustn't stop the app starting; backup.sh refuses to run and pings /fail instead.
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      # After each backup, backup-check.sh checks it's there, recent and encrypted. The restore test needs the
      # private key, so it runs on Zach's machine (backup/restore-test.sh), not here.
      BACKUP_CHECK_HEALTHCHECK_URL: ${BACKUP_CHECK_HEALTHCHECK_URL:-}
      # Optional off-site copy on another provider and account (backup/README.md). Off unless both are set.
      OFFSITE_REMOTE: ${OFFSITE_REMOTE:-}
      OFFSITE_PATH: ${OFFSITE_PATH:-}
      # Encrypted copies of photos the app no longer keeps are pruned once they are this many days old, which must
      # be at least the bucket's lock on photos-age/ (docs/hosting.md#3-r2-buckets-and-tokens). A prune bigger than
      # BACKUP_PRUNE_MAX deletes nothing and fails the run.
      BACKUP_PHOTO_LOCK_DAYS: ${BACKUP_PHOTO_LOCK_DAYS:-30}
      BACKUP_PRUNE_MAX: ${BACKUP_PRUNE_MAX:-100}
      # rclone remotes: "photos" reads the photo bucket, "backups" writes the backup bucket (separate tokens).
      RCLONE_CONFIG_PHOTOS_TYPE: s3
      RCLONE_CONFIG_PHOTOS_PROVIDER: Cloudflare
      RCLONE_CONFIG_PHOTOS_ENDPOINT: ${R2_ENDPOINT}
      RCLONE_CONFIG_PHOTOS_ACCESS_KEY_ID: ${R2_BACKUP_READ_ACCESS_KEY_ID:?set R2_BACKUP_READ_ACCESS_KEY_ID in .env}
      RCLONE_CONFIG_PHOTOS_SECRET_ACCESS_KEY: ${R2_BACKUP_READ_SECRET_ACCESS_KEY:?set R2_BACKUP_READ_SECRET_ACCESS_KEY in .env}
      RCLONE_CONFIG_PHOTOS_NO_CHECK_BUCKET: "true"
      RCLONE_CONFIG_BACKUPS_TYPE: s3
      RCLONE_CONFIG_BACKUPS_PROVIDER: Cloudflare
      RCLONE_CONFIG_BACKUPS_ENDPOINT: ${R2_ENDPOINT}
      RCLONE_CONFIG_BACKUPS_ACCESS_KEY_ID: ${R2_BACKUP_WRITE_ACCESS_KEY_ID:?set R2_BACKUP_WRITE_ACCESS_KEY_ID in .env}
      RCLONE_CONFIG_BACKUPS_SECRET_ACCESS_KEY: ${R2_BACKUP_WRITE_SECRET_ACCESS_KEY:?set R2_BACKUP_WRITE_SECRET_ACCESS_KEY in .env}
      RCLONE_CONFIG_BACKUPS_NO_CHECK_BUCKET: "true"
    # The image's postgres user, no capabilities. Not read-only: the dump and a batch of photos are encrypted in
    # /tmp, and on a tmpfs they would count against this limit.
    mem_limit: 512m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging: *logging

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
